# Dependabot — avisa sobre atualizações e vulnerabilidades nas dependências.
# Só abre pull requests: nada muda no projeto até um PR ser aprovado e mergeado.
# Mensal e agrupado para não gastar minutos do GitHub Actions com um PR por pacote
# (os workflows de Android, testes e deploy rodam em pull_request).
# Alertas de segurança chegam fora desse calendário (Settings → Code security → Dependabot alerts).
# Atualizações major de npm/Gradle são ignoradas na rotina mensal (ver "ignore" abaixo);
# GitHub Actions mantêm major porque costumam trazer migrações exigidas pelo próprio GitHub (ex.: Node 24).
# CocoaPods (iosApp/Podfile) não é suportado pelo Dependabot — revisar manualmente.
version: 2
updates:
  # Actions fixadas por SHA nos workflows — o Dependabot atualiza o SHA e o comentário da versão
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  # Kotlin Multiplatform / Android (gradle/libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.5 → 0.7 quebra a compilação (Clock saiu para kotlin.time.Clock). Migração planejada à
      # parte — remover esta linha quando os imports de Clock no shared forem migrados.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-datetime"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      functions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web-professional"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-professional-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      scripts-all:
        patterns: ["*"]
