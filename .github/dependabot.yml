# Dependabot — avisa sobre atualizações e vulnerabilidades nas dependências.
# Só abre pull requests: nada muda no projeto até um PR ser aprovado e mergeado.
# Mensal e agrupado para não gastar minutos do GitHub Actions com um PR por pacote
# (os workflows de Android, testes e deploy rodam em pull_request).
# Alertas de segurança chegam fora desse calendário (Settings → Code security → Dependabot alerts).
# Atualizações major de npm/Gradle são ignoradas na rotina mensal (ver "ignore" abaixo);
# GitHub Actions mantêm major porque costumam trazer migrações exigidas pelo próprio GitHub (ex.: Node 24).
# CocoaPods (iosApp/Podfile) não é suportado pelo Dependabot — revisar manualmente.
version: 2
updates:
  # Actions fixadas por SHA nos workflows — o Dependabot atualiza o SHA e o comentário da versão
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  # Kotlin Multiplatform / Android (gradle/libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Toolchain (Gradle, AGP, Kotlin) e bibliotecas atreladas à versão do Kotlin: fora da rotina.
      # Kotlin 2.2 → 2.4 + AGP 9.1 → 9.5 + Gradle 9.3 → 9.8 transformam avisos de DSL obsoleta
      # (android {}, kotlinOptions/jvmTarget) em erro de build — exige migração planejada do
      # build.gradle.kts para o novo DSL do AGP 9 / compilerOptions, testada em Android e iOS.
      # kotlinx-datetime 0.5 → 0.7 também quebra (Clock migrou para kotlin.time.Clock).
      - dependency-name: "gradle-wrapper"
      - dependency-name: "com.android.*"
      - dependency-name: "org.jetbrains.kotlin.*"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlinx:*"
      # Firebase KMM 2.1 → 2.7 acompanha o Kotlin e os pods do Firebase no iOS — vai junto da migração
      - dependency-name: "dev.gitlive:*"
      # Navigation 2.10+ (e o Lifecycle 2.11 que ela puxa) exige compileSdk 37, que o AGP 9.1 não
      # suporta — também depende da migração do toolchain. Até lá, só correções da linha 2.9.x.
      - dependency-name: "androidx.navigation:*"
        versions: [">= 2.10.0"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.11.0"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      functions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web-professional"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-professional-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Major fica fora da rotina mensal: pode quebrar compatibilidade e é feito manualmente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      scripts-all:
        patterns: ["*"]
